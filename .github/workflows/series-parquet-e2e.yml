name: Series Parquet E2E
# Not a required check. Runs on pull requests that touch the series_parquet
# surface; run it by hand for wider changes (engine, pdata, receivers).
on:
  pull_request:
    paths:
      - "rust/otap-dataflow/crates/series-lake/**"
      - "rust/otap-dataflow/crates/core-nodes/src/exporters/series_parquet_exporter/**"
      - "rust/otap-dataflow/crates/core-nodes/src/processors/durable_buffer_processor/**"
      - "rust/otap-dataflow/crates/validation/tests/series_parquet/**"
      - "rust/otap-dataflow/configs/series-parquet*"
      - ".github/workflows/series-parquet-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

# One run per pull request or ref; a new commit cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  SERIES_REQUIRE_DOCKER: "1"
  SERIES_MINIO_IMAGE: pgsty/minio@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 # RELEASE.2026-08-04T00-00-00Z
  SERIES_ALLOY_IMAGE: grafana/alloy@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839 # v1.19.2

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: rust/otap-dataflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-rust
          # Restores the dependencies the required build caches on main.
          shared-key: build_required
          workspaces: ./rust/otap-dataflow
          cache-bin: false
          save-if: false
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler pkg-config libssl-dev clang cmake
      - name: Pull the MinIO and Alloy images
        run: |
          docker pull "$SERIES_MINIO_IMAGE"
          docker pull "$SERIES_ALLOY_IMAGE"
      # The version requirements.lock.txt is compiled with.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Install the Python dependencies
        run: |
          python3 -m venv /tmp/series-parquet-venv
          /tmp/series-parquet-venv/bin/pip install --require-hashes \
            -r crates/validation/tests/series_parquet/requirements.lock.txt
      - name: Build the engine
        run: cargo build --locked -p otel-arrow-dfe --bin df_engine --features series-parquet,aws,durable-buffer
      - name: End-to-end tests on local files and MinIO
        run: |
          /tmp/series-parquet-venv/bin/python3 -m unittest \
            crates.validation.tests.series_parquet.test_e2e -v
