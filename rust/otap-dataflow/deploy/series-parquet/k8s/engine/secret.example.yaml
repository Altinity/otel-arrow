# Static S3 credentials, read through the AWS_* variables. Not part of the
# kustomization: create it once per namespace, or leave it out and use IRSA
# (see ../../README.md, "Credentials").
apiVersion: v1
kind: Secret
metadata:
  name: series-parquet-s3
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: replace-me
  AWS_SECRET_ACCESS_KEY: replace-me
